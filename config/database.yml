default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "127.0.0.1") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "email_rules_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_TEST_NAME", "email_rules_test") %>

production: 
  primary: 
    <<: *default
    database: 'email_rules_production'
  cache:
    <<: *default
    migrations_paths: db/cache_migrate
    database: 'email_rules_production'
  queue:
    <<: *default
    migrations_paths: db/cache_migrate
    database: 'email_rules_production'
